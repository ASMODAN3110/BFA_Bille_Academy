# Configuration nginx pour la SPA BFA Bille Academy
# - routing client (react-router) : toute route sert index.html
# - cache long pour les assets hachés de Vite, index.html jamais mis en cache

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets générés par Vite (nommés avec un hash) : cache immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images / polices
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html : jamais en cache (revalidé à chaque navigation)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : n'importe quelle route sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
