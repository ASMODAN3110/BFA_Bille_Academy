# Configuration nginx pour la SPA BFA Bille Academy
# - routing client (react-router) : toute route sert index.html
# - cache long pour les assets hachés de Vite, index.html jamais mis en cache
# - proxy des appels API (/api/*, /admin/dashboard) vers le backend Express :4000
#   (même contrat que le proxy Vite en dev : voir vite.config.ts)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Proxy des appels API vers le backend Express ---
    # Depuis le conteneur frontend, `localhost` = le conteneur lui-même :
    # on utilise `host.docker.internal` (Docker Desktop) qui pointe vers le
    # port 4000 publié sur l'hôte par le conteneur backend (bfa-bille-backend).
    location /api/ {
        proxy_pass http://host.docker.internal:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les routes SPA /admin, /admin/dashboard (React Router) partagent leurs
    # chemins avec les API back-office /admin/dashboard. Même logique que le
    # proxy Vite en dev : on ne proxifie QUE les requêtes API (fetch/XHR,
    # Accept ≠ text/html) ; les navigations navigateur (Accept: text/html)
    # restent servies par le SPA (index.html) via la location nommée @bfa_spa.
    location /admin/ {
        error_page 418 = @bfa_spa;
        if ($http_accept ~* text/html) {
            return 418;
        }
        proxy_pass http://host.docker.internal:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA pour les navigations /admin (et autres routes React Router).
    location @bfa_spa {
        rewrite ^ /index.html break;
    }

    # Assets générés par Vite (nommés avec un hash) : cache immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images / polices
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html : jamais en cache (revalidé à chaque navigation)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : n'importe quelle route sert index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
