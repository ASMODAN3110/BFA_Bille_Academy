# docker-compose.prod.yml — BFA Bille Football Academy (frontend + Traefik)
# Build du frontend React/Vite puis serveur nginx, exposé via Traefik en HTTPS.
#
# Usage :
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml down
#
# ⚠️ Avant de lancer :
#   - pointer le DNS de `bille-football-academy.com` et
#     `www.bille-football-academy.com` vers l'IP du VPS (37.60.234.76) ;
#   - le réseau `traefik-net` doit exister (créé par Traefik).

services:
  frontend:
    build:
      context: ./bfa-bille-frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: bfa-frontend
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bfa-frontend.rule=Host(`bille-football-academy.com`)"
      - "traefik.http.routers.bfa-frontend.entrypoints=https"
      - "traefik.http.routers.bfa-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bfa-frontend.service=bfa-frontend"
      - "traefik.http.services.bfa-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-net"

networks:
  traefik-net:
    external: true
